<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in &middot; ConnectGo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* cyrillic-ext */

      /* cyrillic */

      /* vietnamese */

      /* latin-ext */

      /* latin */

      :root {
        --green: #1c332c;
        --gold: #c2a14d;
        --bg: #f2f1ec;
        --border: #c7cfc9;
        --muted: #5f6b64;
        --danger: #a6312b;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--green);
        font:
          16px/1.5 "Work Sans",
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
      }

      .card {
        width: 100%;
        max-width: 27rem;
        background: #fff;
        border-radius: 20px;
        padding: 2.75rem 2.5rem 2.25rem;
        box-shadow:
          0 1px 2px rgba(28, 51, 44, 0.04),
          0 12px 32px -12px rgba(28, 51, 44, 0.14);
      }

      .wordmark {
        margin: 0 0 2.25rem;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .wordmark em {
        font-style: normal;
        color: var(--gold);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .sub {
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: 1.02rem;
      }

      label {
        display: block;
        margin: 0 0 0.5rem;
        font-weight: 700;
        font-size: 0.98rem;
      }

      input {
        width: 100%;
        margin: 0 0 1.5rem;
        padding: 0.8rem 0.9rem;
        font: inherit;
        color: var(--green);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 9px;
      }

      input:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(28, 51, 44, 0.12);
      }

      button {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.95rem;
        font: inherit;
        font-weight: 700;
        font-size: 1.05rem;
        color: #fff;
        background: var(--green);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #152722;
      }
      button:disabled {
        opacity: 0.65;
        cursor: progress;
      }

      .msg {
        display: none;
        margin: 0 0 1.25rem;
        padding: 0.7rem 0.85rem;
        border: 1px solid;
        border-radius: 9px;
        font-size: 0.93rem;
      }

      .msg.error {
        display: block;
        color: var(--danger);
        border-color: rgba(166, 49, 43, 0.3);
        background: rgba(166, 49, 43, 0.06);
      }

      .msg.info {
        display: block;
        color: var(--muted);
        border-color: var(--border);
        background: rgba(28, 51, 44, 0.03);
      }

      .foot {
        margin: 2.5rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .foot a {
        color: var(--green);
      }

      [hidden] {
        display: none !important;
      }

      /* Original typography: relaxed spacing and moderate weights. */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        font-weight: 400;
        line-height: 1.55;
      }
      h1,
      h2,
      h3,
      .page-title,
      .section-title,
      .wordmark {
        font-family: "Rajdhani", sans-serif;
        font-weight: 500;
        letter-spacing: 0.005em;
        line-height: 1.3;
      }
      button,
      input,
      select,
      textarea {
        font-family: "Work Sans", sans-serif;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <p class="wordmark">CONNECT<em>GO</em></p>

      <!-- Normal state: the sign-in form. -->
      <section id="signin">
        <h1>Sign in</h1>
        <p class="sub">Use your ConnectGo dashboard account.</p>

        <div id="message" class="msg"></div>

        <form id="form">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            required
            autocomplete="username"
            autofocus
          />

          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          />

          <button id="submit" type="submit">Sign in</button>
        </form>

        <p class="foot">
          Need access or a password reset? Contact a dashboard administrator.
        </p>
      </section>

      <!-- Signed in, but missing this dashboard's role. Same file, no form. -->
      <section id="denied" hidden>
        <h1>No access</h1>
        <p class="sub">
          You're signed in, but this dashboard isn't on your list.
        </p>
        <p class="foot" style="margin-top: 0">
          Your account doesn't have access to the
          <strong id="site">requested</strong>
          dashboard. Ask an administrator to add it.
        </p>
        <p class="foot">
          <a href="/.netlify/functions/auth?action=logout">Sign out</a>
        </p>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var params = new URLSearchParams(location.search);
        var DASHBOARDS = ["governance", "kb", "ops", "financials"];

        // The gate sends ?denied=<site> when the session is valid but the role is
        // missing. Checked against the list above and set as text, not HTML, so a
        // hand-edited URL can't inject markup.
        var denied = params.get("denied");

        if (denied && DASHBOARDS.indexOf(denied) !== -1) {
          document.getElementById("signin").hidden = true;
          document.getElementById("denied").hidden = false;
          document.getElementById("site").textContent = denied;
          return;
        }

        var form = document.getElementById("form");
        var button = document.getElementById("submit");
        var message = document.getElementById("message");

        if (params.get("signed_out")) {
          message.textContent = "You have been signed out.";
          message.className = "msg info";
        }

        function fail(text) {
          message.textContent = text;
          message.className = "msg error";
          button.disabled = false;
          button.textContent = "Sign in";
        }

        // Only ever continue to a path on this same site. Using `next` straight
        // from the query string would be an open redirect — a crafted link could
        // bounce a signed-in colleague to someone else's page.
        function destination() {
          var next = params.get("next") || "/";
          var isRelative =
            next.charAt(0) === "/" &&
            next.charAt(1) !== "/" &&
            next.charAt(1) !== "\\";
          return isRelative ? next : "/";
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          button.disabled = true;
          button.textContent = "Signing in…";
          message.className = "msg";

          fetch("/.netlify/functions/auth?action=login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          })
            .then(function (response) {
              return response
                .json()
                .catch(function () {
                  return {};
                })
                .then(function (data) {
                  return { ok: response.ok, data: data };
                });
            })
            .then(function (result) {
              if (result.ok) {
                location.replace(destination());
                return;
              }
              document.getElementById("password").value = "";
              fail(result.data.error || "Sign-in failed. Please try again.");
            })
            .catch(function () {
              fail(
                "Could not reach the sign-in service. Check your connection.",
              );
            });
        });
      })();
    </script>
  </body>
</html>
